<!DOCTYPE html>
<html lang="en">
	<head>
		<meta charset="UTF-8" />
		<meta name="viewport" content="width=device-width, initial-scale=1.0" />
		<title>17mov_VehicleDirtSystem</title>

		<link rel="stylesheet" href="assets/stylesheets/fonts.css" />
		<link rel="stylesheet" href="assets/stylesheets/style.css" />
	</head>
	<body>
		<div class="wrapper" style="display: none; opacity: 0">
			<div class="heading-wrapper">
				<h1 class="heading">Detailing shop</h1>
				<p class="description">Make your car beautiful</p>
			</div>
			<section class="section-wrapper" id="products">
				<div class="title-wrapper">
					<h1 class="title">Products</h1>
					<div class="line"></div>
				</div>
				<div class="products-wrapper"></div>
			</section>
			<section class="section-wrapper" id="basket">
				<div class="title-wrapper">
					<h1 class="title">Basket</h1>
					<div class="line"></div>
				</div>
				<div class="basket-wrapper"></div>
			</section>
			<div class="checkout">
				<div class="checkout-total">
					<img src="assets/images/BasketIcon.svg" alt="" />
					<h1 class="checkout-total-text">
						Total price: <span>$0</span>
					</h1>
				</div>
				<div class="checkout-buttons">
					<button id="card">Pay With Card</button>
					<button id="cash">Pay With Cash</button>
				</div>
			</div>
		</div>

		<script src="assets/scripts/money.js"></script>
		<script src="assets/scripts/app.js"></script>
	</body>
</html>
